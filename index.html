<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sajal - Portfolio</title>
  <meta name="description" content="Portrait and event photography by Sajal.">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Sajal - Portfolio">
  <meta property="og:description" content="Portrait and event photography by Sajal.">
  <!-- Optional: add <meta property="og:image" content="https://YOUR-DOMAIN/images/your-photo-1200.webp"> so links show a preview -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23000'/%3E%3Ctext x='32' y='44' font-family='Helvetica,Arial,sans-serif' font-size='36' font-weight='700' text-anchor='middle' fill='%23fff'%3ES%3C/text%3E%3C/svg%3E">
  <script>document.documentElement.classList.add('js');</script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ============================================================
       EDIT ME: your contact details live in this nav (3 links below)
       ============================================================ -->
  <header class="header">
    <button class="menu-trigger" id="menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="menu">
      <span class="menu-text">Sajal</span>
      <span class="close-icon" aria-hidden="true">&times;</span>
    </button>
  </header>

  <div class="menu" id="menu">
    <nav class="menu-content" aria-label="Main">
      <button type="button" class="menu-link" id="about-open">About</button>
      <a class="menu-link" href="mailto:you@example.com">Contact</a>
      <a class="menu-link menu-link--icon" href="https://instagram.com/yourusername" target="_blank" rel="noopener">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
        Instagram
      </a>
    </nav>
  </div>

  <dialog class="about" id="about" aria-labelledby="about-title">
    <h2 id="about-title">About Me</h2>
    <p>I am a passionate hobbyist who loves photography. I like doing portrait and event photoshoots. Contact me if you want to get in touch.</p>
    <button type="button" class="about-close" id="about-close" aria-label="Close">&times;</button>
  </dialog>

  <main>
    <div class="top-sentinel" aria-hidden="true"></div>

    <!-- The gallery below is GENERATED by `npm run build` (see README.md).
         Don't edit between the markers; add photos to /source and re-run the build. -->
    <section class="gallery" aria-label="Photo gallery">
<!-- GALLERY:START -->
<!-- GALLERY:END -->
    </section>
  </main>

  <footer class="footer">
    &copy; <span id="year">2026</span> Sajal. All images are protected by copyright.
  </footer>

  <button class="to-top" id="to-top" type="button" aria-label="Back to top">&uarr;</button>

  <dialog class="lightbox" id="lightbox" aria-label="Photo viewer">
    <button type="button" class="lb-btn lb-close" aria-label="Close">&times;</button>
    <button type="button" class="lb-btn lb-prev" aria-label="Previous photo">&#8249;</button>
    <button type="button" class="lb-btn lb-next" aria-label="Next photo">&#8250;</button>
    <div class="lb-stage"><img class="lb-img" alt=""></div>
    <p class="lb-count" aria-live="polite"></p>
  </dialog>

  <script src="js/main.js"></script>
</body>
</html>
