name: Build gallery

# Runs on GitHub's servers whenever you add or change photos in source/ (or edit data/photos.json).
# It resizes the photos, rebuilds the gallery in index.html and saves the result back to your repo.
on:
  push:
    branches: [main, master]
    paths:
      - 'source/**'
      - 'data/photos.json'
      - 'tools/**'
  workflow_dispatch:   # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: build-gallery
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Build gallery
        run: npm run build

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html images data
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Update gallery"
            git push
          fi
