<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Calendar</title>

<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.18/index.global.min.css"
>

<link rel="stylesheet" href="style.css">
```

</head>

<body>

```
<div class="calendar-container">

    <div class="calendar-header">

        <div>
            <h1>My Calendar</h1>
            <p>Plan your time</p>
        </div>

        <button
            id="newEventButton"
            class="new-event-button"
            type="button"
        >
            + New event
        </button>

    </div>

    <div id="calendar"></div>

</div>


<!-- Event Modal -->

<div
    id="eventModal"
    class="modal hidden"
>

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="modalTitle">
                New event
            </h2>

            <button
                id="closeModal"
                class="close-button"
                type="button"
            >
                ×
            </button>

        </div>


        <form id="eventForm">

            <input
                type="hidden"
                id="eventId"
            >


            <div class="form-group">

                <label for="eventTitle">
                    Title
                </label>

                <input
                    type="text"
                    id="eventTitle"
                    required
                    autocomplete="off"
                >

            </div>


            <div class="form-group">

                <label>
                    <input
                        type="checkbox"
                        id="allDay"
                    >
                    All day
                </label>

            </div>


            <div class="form-group">

                <label for="eventDate">
                    Date
                </label>

                <input
                    type="date"
                    id="eventDate"
                    required
                >

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="startTime">
                        Start
                    </label>

                    <input
                        type="time"
                        id="startTime"
                    >

                </div>


                <div class="form-group">

                    <label for="endTime">
                        End
                    </label>

                    <input
                        type="time"
                        id="endTime"
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="eventLocation">
                    Location
                </label>

                <input
                    type="text"
                    id="eventLocation"
                    autocomplete="off"
                >

            </div>


            <div class="form-group">

                <label for="eventNotes">
                    Notes
                </label>

                <textarea
                    id="eventNotes"
                    rows="4"
                ></textarea>

            </div>


            <div class="modal-actions">

                <button
                    type="button"
                    id="deleteButton"
                    class="delete-button hidden"
                >
                    Delete
                </button>

                <div class="modal-actions-right">

                    <button
                        type="button"
                        id="cancelButton"
                        class="secondary-button"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="primary-button"
                    >
                        Save
                    </button>

                </div>

            </div>

        </form>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.18/index.global.min.js"></script>

<script src="app.js"></script>

</body>
</html>
